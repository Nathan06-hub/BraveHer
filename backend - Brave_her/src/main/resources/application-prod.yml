spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:braveher}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

server:
  port: ${PORT:8084}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:braveher-bf}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  seed:
    enabled: false

logging:
  level:
    com.braveher: INFO
