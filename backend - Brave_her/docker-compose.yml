services:
  db:
    image: postgres:16-alpine
    container_name: braveher-db
    environment:
      POSTGRES_DB: braveher
      POSTGRES_USER: braveher_user
      POSTGRES_PASSWORD: braveher_pass
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braveher_user -d braveher"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: braveher-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: braveher_user
      DB_PASSWORD: braveher_pass

volumes:
  db_data: